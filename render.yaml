services:
  - type: web
    name: textile-erp-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run migrate:deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: textile-erp-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://textile-erp-web.onrender.com

  - type: web
    name: textile-erp-web
    runtime: static
    plan: starter
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://textile-erp-api.onrender.com/api

databases:
  - name: textile-erp-db
    plan: starter
    databaseName: textile_erp
    user: textile_erp
